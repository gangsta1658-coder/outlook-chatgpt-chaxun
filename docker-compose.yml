services:
  mail-audit:
    build:
      context: .
    image: local/mail-audit:1.0.0
    container_name: mail-audit
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:4399:4399"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4399/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
